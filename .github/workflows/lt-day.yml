name: lt-day

# One Lithuanian day, fetched and delivered.
#
# WHY THIS IS NOT `eis-batch`. Latvia's day is four runners drawing four addresses at a
# portal that refuses about a third of them, each shard retrying its own chain, and a
# `collect` job afterwards reconciling four shard indexes into one list. EPPS refuses none
# and serves each procurement as a single archive, so none of that machinery has anything
# to do here: one runner, one pass, and the day's two files written directly.
#
# Pointing `eis-batch` at `country: LT` is the thing this file exists to make unnecessary.
# That input reaches only the DELIVERY step; the fetch below it is `batch.py`, which speaks
# EIS and nothing else. The run would fetch Latvia, file it under `work/LT/`, and report
# success — the failure `country.py` was written against.

on:
  # NO SCHEDULE, DELIBERATELY — the same reasoning as `eis-batch.yml`. The consumer that
  # reads the day is the one that starts it, so there is exactly one actor per day and no
  # second, redundant fetch of the same window. GitHub's cron is a wish that can fire hours
  # late, and nothing that must finish before a fixed hour can be built on it.
  workflow_dispatch:
    inputs:
      date:
        description: "The day to fetch, YYYY-MM-DD in Vilnius. The caller owns it; blank means the runner's UTC date"
        required: false
        default: ""
      targets:
        description: "Ids to re-read whatever the gate says — the cards somebody is still deciding about. One per line; EPPS:<id> or the bare id"
        required: false
        default: ""
      limit:
        description: "Stop after this many procurements — for a trial run, not for a night"
        required: false
        default: ""

permissions:
  contents: read

# One run per day, for the same reason Latvia has one: two runs are two draws at a state
# portal and two `day.json` files for one date, the second describing less than the first.
concurrency:
  group: lt-day
  cancel-in-progress: false

jobs:
  day:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    # The same pinned toolchain Latvia uses. LibreOffice reads the Word 97 attachments
    # buyers still send, p7zip opens the .7z a building project arrives in, and Tesseract
    # reads the scans — none of which `apt-get` on the day would install at a fixed version.
    container:
      image: ${{ vars.TOOLCHAIN_IMAGE }}
    steps:
      # Pinned to a full SHA because this repository's Actions policy allows nothing else.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test
        run: python3 -m unittest discover -s tests -t tests

      # THE DAY IS DECIDED ONCE, HERE, AND EVERY LATER STEP READS IT. It used to be computed
      # independently in the fetch step and again in the delivery step, so a run that crossed
      # UTC midnight between them fetched one folder and delivered another — and the second
      # one does not exist.
      #
      # The default is YESTERDAY IN VILNIUS, not the runner's UTC today. The window search is
      # by publication date, and this job's own schedule fires at 00:40 UTC, which is 03:40 in
      # Vilnius: `date -u +%F` there names a day less than four hours old, so a blank input
      # would ask the portal for a morning that has barely started and deliver a near-empty
      # day that calls itself complete.
      - name: Which day this is
        env:
          RUN_DATE: ${{ inputs.date }}
        run: |
          # Computed in UTC on purpose rather than in Europe/Vilnius: the image installs no
          # tzdata, so a named zone would be silently ignored and answer UTC anyway. It is
          # the same answer at this job's hour — Vilnius runs three hours ahead, so its date
          # and UTC's agree for every moment before 21:00 UTC, and this fires at 00:40.
          DAY="${RUN_DATE:-$(date -u -d 'yesterday' +%F)}"
          echo "DAY=$DAY" >> "$GITHUB_ENV"
          echo "the day is $DAY"

      # THE GATE IS CHECKED BEFORE THE PORTAL IS TOUCHED, AND THIS STEP IS WHY IT IS A STEP.
      # `batch.load_policy` fails open on purpose — an unreadable policy returns None rather
      # than dropping every procurement, which is the right call inside a library. For an
      # unattended night it is the wrong outcome: no gate means fetching every archive the
      # window holds, roughly 119 of them, from a state portal, because a secret was
      # misspelt. So the policy is required to parse here, and the run stops if it does not.
      - name: The recall policy, and how much of the day it lets through
        env:
          LT_POLICY: ${{ secrets.LT_POLICY }}
        run: |
          # THE SECRET IS REQUIRED, AND FALLING BACK TO THE COMMITTED FILE WOULD BE WORSE
          # THAN STOPPING. `lt_policy.example.json` is an unrelated illustration — office
          # printing — chosen so the repository discloses nothing about what anybody
          # actually hunts for. A night run against it would fetch almost nothing, deliver a
          # valid day, and report success, which is the one failure shape nobody catches:
          # an empty morning reads exactly like a quiet one.
          if [ -z "$LT_POLICY" ]; then
            echo "::error::no LT_POLICY secret. The committed example is an unrelated illustration and would produce an almost empty night that looks like a successful one."
            exit 1
          fi
          printf '%s' "$LT_POLICY" > policy.json
          echo "policy: from the repository secret"
          python3 -c "
          import sys, batch
          rules = batch.load_policy('policy.json')
          if rules is None:
              sys.exit('the recall policy did not parse — refusing to fetch the whole day ungated')
          # READ BY POSITION, NEVER UNPACKED. This line used to be a four-way unpack, and on
          # 28 Aug 2026 load_policy grew a fifth field — the recall codes. Two nights died
          # here with ValueError before anybody looked, because the step that exists to
          # protect the night was itself brittle to the thing it was checking. A sixth field
          # now prints as a number instead of stopping the run.
          names = ('recall term', 'excluded division', 'excluded title term',
                   'override', 'recall code')
          print('policy: ' + ', '.join(
              '%d %s(s)' % (len(v), names[i] if i < len(names) else 'field %d' % (i + 1))
              for i, v in enumerate(rules)))
          "

      - name: Fetch the day
        env:
          EIS_POLICY: policy.json
          EIS_COUNTRY: LT
          LIMIT: ${{ inputs.limit }}
          TARGETS: ${{ inputs.targets }}
        run: |
          # The window and the watch list go in ONE pass, deduplicated by the tool. Asking
          # twice would be two draws at one portal for one date and two answers about what
          # that date held.
          printf '%s' "$TARGETS" > targets.txt
          echo "fetching the Lithuanian window for $DAY, plus $(grep -c . targets.txt || true) watched id(s)"
          rc=0
          python3 eis_tool.py day "$DAY" --out work \
            ${LIMIT:+--limit $LIMIT} \
            $([ -s targets.txt ] && echo "--targets targets.txt") \
            --policy policy.json || rc=$?

          # A SHORT DAY IS STILL A DAY, AND IT STILL GETS DELIVERED. `day` exits 1 when any
          # target did not arrive — one withdrawn procurement, one card EPPS served its
          # login form for — and under `sh -e` that would skip the delivery below and throw
          # away every procurement that DID arrive. This is the same rule Latvia's `collect`
          # job states as `if: always()`: a target that failed is the ordinary case the
          # day's own file exists to describe, and `day.json` records it in `lost` and marks
          # itself incomplete. Only a real error — a bad country, an unparseable argument,
          # an interpreter that died — stops the run.
          if [ "$rc" -eq 1 ]; then
            echo "::warning::the day is short — day.json names what did not arrive, and it is delivered anyway"
          elif [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi

      # The day is on the runner's disk and the runner is about to disappear. Everything
      # after this line is what makes it a day somebody can read tomorrow — and, because the
      # comparison against the drive happens inside it, what makes "what moved" mean
      # anything at all on the second night.
      #
      # Silent about where it writes: every coordinate is a secret and the script prints
      # counts rather than paths. With no secrets configured the step does not run and the
      # workflow stays usable by anyone without carrying anybody's addresses.
      - name: Deliver the day where the reader can reach it
        if: ${{ success() && env.HAVE_GRAPH == 'true' }}
        env:
          HAVE_GRAPH: ${{ secrets.GRAPH_DRIVE_ID != '' }}
          GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
          GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
          GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
          GRAPH_DRIVE_ID: ${{ secrets.GRAPH_DRIVE_ID }}
          GRAPH_DEST_ROOT: ${{ secrets.GRAPH_DEST_ROOT }}
          EIS_COUNTRY: LT
        run: |
          python3 deliver_lt.py --out work --date "$DAY"
