name: eis-shard-chain

# One independent retry chain for one shard. A refused runner address advances only this
# shard to the next draw; other shards keep downloading without becoming a barrier.

on:
  workflow_call:
    inputs:
      shard: {required: true, type: number}
      shards: {required: true, type: number}
      days: {required: false, type: string, default: "1"}
      date_from: {required: false, type: string, default: ""}
      date_to: {required: false, type: string, default: ""}
      targets: {required: false, type: string, default: ""}
      llm_max_files: {required: false, type: string, default: "40"}
      pause: {required: false, type: string, default: "5"}
      skip_archive: {required: false, type: boolean, default: false}
      date: {required: false, type: string, default: ""}
      country: {required: false, type: string, default: "LV"}
      walk: {required: false, type: boolean, default: true}
      walk_budget: {required: false, type: string, default: ""}
      walk_hand: {required: false, type: string, default: ""}

permissions:
  contents: read
  actions: read

jobs:
  draw-1:
    uses: ./.github/workflows/eis-shard.yml
    secrets: inherit
    with:
      shard: ${{ inputs.shard }}
      shards: ${{ inputs.shards }}
      draw: 1
      days: ${{ inputs.days }}
      date_from: ${{ inputs.date_from }}
      date_to: ${{ inputs.date_to }}
      targets: ${{ inputs.targets }}
      llm_max_files: ${{ inputs.llm_max_files }}
      pause: ${{ inputs.pause }}
      skip_archive: ${{ inputs.skip_archive }}
      date: ${{ inputs.date }}
      country: ${{ inputs.country }}
      walk: ${{ inputs.walk }}
      walk_budget: ${{ inputs.walk_budget }}
      walk_hand: ${{ inputs.walk_hand }}

  # A later draw runs only while no earlier one said its shard is done. The output, not the
  # artifact: on a runner named by SHARD_RUNS_ON no artifact is uploaded at all.
  draw-2:
    needs: draw-1
    if: ${{ always() && needs.draw-1.outputs.done != 'true' }}
    uses: ./.github/workflows/eis-shard.yml
    secrets: inherit
    with:
      shard: ${{ inputs.shard }}
      shards: ${{ inputs.shards }}
      draw: 2
      days: ${{ inputs.days }}
      date_from: ${{ inputs.date_from }}
      date_to: ${{ inputs.date_to }}
      targets: ${{ inputs.targets }}
      llm_max_files: ${{ inputs.llm_max_files }}
      pause: ${{ inputs.pause }}
      skip_archive: ${{ inputs.skip_archive }}
      date: ${{ inputs.date }}
      country: ${{ inputs.country }}
      walk: ${{ inputs.walk }}
      walk_budget: ${{ inputs.walk_budget }}
      walk_hand: ${{ inputs.walk_hand }}

  draw-3:
    needs: [draw-1, draw-2]
    if: ${{ always() && needs.draw-1.outputs.done != 'true' && needs.draw-2.outputs.done != 'true' }}
    uses: ./.github/workflows/eis-shard.yml
    secrets: inherit
    with:
      shard: ${{ inputs.shard }}
      shards: ${{ inputs.shards }}
      draw: 3
      days: ${{ inputs.days }}
      date_from: ${{ inputs.date_from }}
      date_to: ${{ inputs.date_to }}
      targets: ${{ inputs.targets }}
      llm_max_files: ${{ inputs.llm_max_files }}
      pause: ${{ inputs.pause }}
      skip_archive: ${{ inputs.skip_archive }}
      date: ${{ inputs.date }}
      country: ${{ inputs.country }}
      walk: ${{ inputs.walk }}
      walk_budget: ${{ inputs.walk_budget }}
      walk_hand: ${{ inputs.walk_hand }}
